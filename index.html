<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triton Robotics</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1a1a2e;
      color: white;
      padding: 1rem 2rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    nav {
      position: relative;
    }

    .dropbtn {
      background-color: transparent;
      color: white;
      border: 1px solid white;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 4px;
    }

    .dropbtn:hover {
      background-color: white;
      color: #1a1a2e;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      background-color: white;
      min-width: 160px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
      border-radius: 4px;
      overflow: hidden;
      z-index: 1;
    }

    .dropdown-content a {
      color: #1a1a2e;
      padding: 0.75rem 1rem;
      text-decoration: none;
      display: block;
    }

    .dropdown-content a:hover {
      background-color: #f1f1f1;
    }

    nav:hover .dropdown-content {
      display: block;
    }

    main {
      padding: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Triton Robotics</h1>
    <nav>
      <button class="dropbtn">Resources ▾</button>
      <div class="dropdown-content">
        <a href="H533REpinout.html">Nucleo H533RE Pinout</a>
      </div>
    </nav>
  </header>

  <main>
    <p>Welcome to the Triton Robotics website.</p>
  </main>

</body>
</html>
