<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resources | Triton Robotics</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 2rem;
  }

  h1 {
    margin-top: 0;
  }

  a.back {
    display: inline-block;
    margin-bottom: 1rem;
  }

  /* --- Search bar --- */
  #controls {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    margin-bottom: 1rem;
  }

  #search {
    padding: 0.5rem 0.75rem;
    font-size: 1rem;
    width: 260px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  #showAllBtn {
    padding: 0.5rem 1rem;
    background: rgb(186, 189, 237);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.95rem;
  }

  #showAllBtn:hover {
    background: rgb(160, 163, 220);
  }

  #matchCount {
    font-size: 0.9rem;
    color: #555;
  }

  /* --- Image + pin markers --- */
  #board-wrapper {
    position: relative;
    display: inline-block;
  }

  #board-img {
    height: 800px;
    display: block;
    max-width: 100%;
  }

  .pin-marker {
    position: absolute;
    width: 12px;
    height: 12px;
    margin-left: -8px;
    margin-top: -8px;
    background: rgba(72, 255, 0, 0.507);
    border: 2.5px solid rgb(72, 255, 0);
    cursor: pointer;
    transition: transform 0.1s ease, background 0.1s ease, border-color 0.1s ease;
  }

  .pin-marker:hover,
  .pin-marker.highlight {
    background: rgba(255, 200, 80, 0.85);
    border-color: #b8860b;
    transform: scale(1.4);
    z-index: 5;
  }

  .pin-marker.dimmed {
    opacity: 0;
  }

.pin-marker.group-highlight {
    background: rgba(120, 200, 255, 0.85);
    border-color: #1a6fa8;
    transform: scale(1.3);
    z-index: 4;
  }


  /* --- Tooltip --- */
  #tooltip {
    position: absolute;
    display: none;
    background: #1a1a2e;
    color: white;
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    font-size: 0.85rem;
    max-width: 240px;
    pointer-events: none;
    z-index: 10;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  #tooltip .pin-name {
    font-weight: bold;
    margin-bottom: 0.25rem;
  }

  #tooltip ul {
    margin: 0;
    padding-left: 1.1rem;
  }
</style>
</head>
<body>

  <a class="back" href="index.html">&larr; Back to home</a>
  <h1>Nucleo H533RE Pinout</h1>

  <div id="controls">
    <input type="text" id="search" placeholder="Search pin name or function (e.g. PA5, SPI, ADC)...">
    <button id="showAllBtn">Show All</button>
    <span id="matchCount"></span>
  </div>

  <div id="board-wrapper">
    <img id="board-img" src="assets/nucleo/Nucleo_H533RE.png" alt="Nucleo H533RE top view">
    <div id="tooltip"></div>
    <!-- pin markers are injected here by JS -->
  </div>

  <script>
    // ---------------------------------------------------------------
    // PIN DATA
    // x and y are PERCENTAGES of the image width/height (0-100),
    // NOT pixels. This keeps markers aligned even if the image is
    // resized or viewed on a different screen.
    //
    // To find a pin's x/y: open the image in an image editor (or
    // even MS Paint / Preview), hover the pin, note the pixel
    // coordinates, then:
    //   x% = (pixel_x / image_width_px)  * 100
    //   y% = (pixel_y / image_height_px) * 100
    // ---------------------------------------------------------------
    const pins = [ 
    // Increment x by 4 to go 1 pin to right
    // increment y by

    //Left Group
    { name: "E5V", x: 8, y: 44, functions: ["External 5 volt power at 500mA"]},


    // Right Group

        // Arduino Top
        { name: "PB6", x: 84, y: 38.5, functions: ["I2C1_SCL"], group: "PB6"},
        { name: "PB7", x: 84, y: 41.5, functions: ["I2C1_SDA"], group: "PB7"},




    { name: "GND", x: 15.0, y: 69, functions: ["Ground"], group: "GND" },


    ];

    const wrapper = document.getElementById("board-wrapper");
    const tooltip = document.getElementById("tooltip");
    const searchInput = document.getElementById("search");
    const showAllBtn = document.getElementById("showAllBtn");
    const matchCount = document.getElementById("matchCount");

    // Create a marker element for each pin
    const markerEls = pins.map(pin => {
      const el = document.createElement("div");
      el.className = "pin-marker";
      el.style.left = pin.x + "%";
      el.style.top = pin.y + "%";
      el.dataset.name = pin.name.toLowerCase();
      el.dataset.functions = pin.functions.join(" ").toLowerCase();

    el.addEventListener("mouseenter", () => {
        showTooltip(pin);
        highlightGroup(pin);
    });

    el.addEventListener("mousemove", (e) => positionTooltip(e));
    el.addEventListener("mouseleave", () => {
        hideTooltip();
        clearGroupHighlight();
    });

      wrapper.appendChild(el);
      return { el, pin };
    });

    function showTooltip(pin) {
      const groupNote = pin.group
        ? `<div style="opacity:0.7; font-size:0.75rem; margin-top:0.25rem;">connected to ${pins.filter(p => p.group === pin.group).length - 1} other ${pin.group} pin(s)</div>`
        : "";
      tooltip.innerHTML = `
        <div class="pin-name">${pin.name}</div>
        <ul>${pin.functions.map(f => `<li>${f}</li>`).join("")}</ul>
        ${groupNote}
      `;
      tooltip.style.display = "block";
    }

    function positionTooltip(e) {
      const rect = wrapper.getBoundingClientRect();
      tooltip.style.left = (e.clientX - rect.left + 15) + "px";
      tooltip.style.top = (e.clientY - rect.top + 15) + "px";
    }

    function hideTooltip() {
      tooltip.style.display = "none";
    }

    function highlightGroup(hoveredPin) {
      if (!hoveredPin.group) return;
      markerEls.forEach(({ el, pin }) => {
        if (pin.group === hoveredPin.group) {
          el.classList.add("group-highlight");
        }
      });
    }
 
    function clearGroupHighlight() {
      markerEls.forEach(({ el }) => el.classList.remove("group-highlight"));
    }




    // Search: highlight matches, dim non-matches
    function runSearch() {
      const query = searchInput.value.trim().toLowerCase();
      let matches = 0;

      markerEls.forEach(({ el }) => {
        if (query === "") {
          el.classList.remove("highlight", "dimmed");
          return;
        }
        const isMatch = el.dataset.name.includes(query) || el.dataset.functions.includes(query);
        el.classList.toggle("highlight", isMatch);
        el.classList.toggle("dimmed", !isMatch);
        if (isMatch) matches++;
      });

      matchCount.textContent = query === "" ? "" : `${matches} match${matches === 1 ? "" : "es"}`;
    }

    searchInput.addEventListener("input", runSearch);

    showAllBtn.addEventListener("click", () => {
      searchInput.value = "";
      runSearch();
    });
  </script>

</body>
</html>
