<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resources | Triton Robotics</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 2rem;
  }

  h1 {
    margin-top: 0;
  }

  a.back {
    display: inline-block;
    margin-bottom: 1rem;
  }

  /* --- Search bar --- */
  #controls {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    margin-bottom: 1rem;
  }

  #search {
    padding: 0.5rem 0.75rem;
    font-size: 1rem;
    width: 260px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  #showAllBtn {
    padding: 0.5rem 1rem;
    background: rgb(186, 189, 237);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.95rem;
  }

  #showAllBtn:hover {
    background: rgb(160, 163, 220);
  }

  #matchCount {
    font-size: 0.9rem;
    color: #555;
  }

  /* --- Image + pin markers --- */
  #board-wrapper {
    position: relative;
    display: inline-block;
  }

  #board-img {
    height: 800px;
    display: block;
    max-width: 100%;
  }

  .pin-marker {
    position: absolute;
    width: 12px;
    height: 12px;
    margin-left: -8px;
    margin-top: -8px;
    background: rgba(72, 255, 0, 0.507);
    border: 2.5px solid rgb(72, 255, 0);
    cursor: pointer;
    transition: transform 0.1s ease, background 0.1s ease, border-color 0.1s ease;
  }

  .pin-marker:hover,
  .pin-marker.highlight {
    background: rgba(255, 200, 80, 0.85);
    border-color: #b8860b;
    transform: scale(1.4);
    z-index: 5;
  }

  .pin-marker.dimmed {
    opacity: 0;
  }

.pin-marker.group-highlight {
    background: rgba(120, 200, 255, 0.85);
    border-color: #1a6fa8;
    transform: scale(1.3);
    z-index: 4;
  }


  /* --- Tooltip --- */
  #tooltip {
    position: absolute;
    display: none;
    background: #1a1a2e;
    color: white;
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    font-size: 0.85rem;
    max-width: 240px;
    pointer-events: none;
    z-index: 10;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  #tooltip .pin-name {
    font-weight: bold;
    margin-bottom: 0.25rem;
  }

  #tooltip ul {
    margin: 0;
    padding-left: 1.1rem;
  }
</style>
</head>
<body>

  <a class="back" href="index.html">&larr; Back to home</a>
  <h1>Nucleo H533RE Pinout</h1>

    <input type="text" id="search" placeholder="Search pin name or function (e.g. PA5, SPI, ADC)...">
    <button id="showAllBtn">Show All</button>
    <span id="matchCount"></span>
  </div>

      { name: "GND", x: 15.0, y: 66, functions: ["Ground"], group: "GND"},
      { name: "GND", x: 15.0, y: 68.7, functions: ["Ground"], group: "GND"},
      { name: "VIN", x: 15.0, y: 71.5, functions: ["Power Input (7V = 800mA, (7V, 9V) = 450mA, [9V, 12V] = 250mA)"], group: "VIN"},
      
      // CN8 ANALOG

      { name: "PA1", x: 15.0, y: 80, functions: ["ADC1_INP1"], group: "PA1"},
      { name: "PA2/PB1", x: 15.0, y: 83, functions: []}, // HERE!!!

      { name: "PC1(DEFAULT)/PB7", x: 15.0, y: 89.5, functions: ["ADC1_INP11 (PC1)", "I2C1_SDA (PB7)"], group: "PC1"},
      { name: "PC0(DEFAULT)/PB6", x: 15.0, y: 92.5, functions: ["ADC1_INP10 (PC0)", "ADC1_INP10(PB6)"], group: "PC0"},

    // Right Group

        // CN5 DIGITAL
        { name: "PB6", x: 84, y: 38.5, functions: ["I2C1_SCL", "I3C1_SCL"], group: "PB6"},
        { name: "PB7", x: 84, y: 41.5, functions: ["I2C1_SDA", "I3C1_SDA"], group: "PB7"},
        { name: "", x: 84, y: 45, functions: ["AVDD"], group: "AVDD"},
        { name: "", x: 84, y: 48, functions: ["Ground"], group: "GND"},
        { name: "PA5", x: 84, y: 51, functions: ["SPI1_SCK"], group: "PA5"},
        { name: "PA6", x: 84, y: 54, functions: ["SPI1_MISO"], group: "PA6"},
        { name: "PA7", x: 84, y: 57, functions: ["TIM3_CH2", "SPI1_MOSI"], group: "PA7"},

        { name: "PC6", x: 84, y: 63, functions: ["TIM3_CH1"], group: "PC6"},
        { name: "PC7", x: 84, y: 66, functions: ["IO"], group: "IO"},

        // CN9 DIGITAL
        { name: "PA8", x: 84, y: 71, functions: ["IO"], group: "IO"},
        { name: "PB10", x: 84, y: 74, functions: ["TIM2_CH3"], group: "PB10"},
        { name: "PB4", x: 84, y: 77, functions: ["TIM1_CH2"], group: "PB4"},
        { name: "PB5", x: 84, y: 80, functions: ["IO"], group: "IO"},
        { name: "PB3", x: 84, y: 83, functions: ["TIM2_CH2", "T_SWO"], group: "PB3"},
        { name: "PA10(*)/PC8(*)", x: 84, y: 86, functions: []}, // HERE!!!
        { name: "PB14(DEFAULT)/PA4(*)/P2(*)", x: 84, y: 89, functions: ["ARD_D1 (PB14 DEFAULT)", "STLINK_TX (T_VCP_TX) (*)"], group: "PB14"}, // HERE!!! AND FOR

        // CN10 ODD PINS
        // { name: "", x: 91.5, y: 38, functions: []},
        { name: "PB6", x: 91.5, y: 41, functions: ["I2C1_SCL", "I3C1_SCL"], group: "PB6"},
        { name: "PB7", x: 91.5, y: 44, functions: ["I2C1_SDA", "I3C1_SDA"], group: "PB7"},
        { name: "AVDD", x: 91.5, y: 47, functions: ["AVDD is connected to VDD_MCU by default (R33 fitted)."], group: "AVDD"},
        { name: "GND", x: 91.5, y: 50, functions: ["Ground"], group: "GND"},
        { name: "PA5", x: 91.5, y: 53, functions: ["SPI1_SCK"], group: "PA5"},
        { name: "PA6", x: 91.5, y: 56, functions: ["SPI1_MISO"], group: "PA6"},
        { name: "PA7", x: 91.5, y: 59, functions: ["SPI1_MOSI", "TIM3_CH2"], group: "PA7"},
        { name: "PC9", x: 91.5, y: 62, functions: ["SPIx_CS", "TIM3_CH4"], group: "PC9"},

        { name: "PC7", x: 91.5, y: 68, functions: ["IO"], group: "IO"},

        { name: "PA10(*)/PB8(*)", x: 91.5, y: 86, functions: []}, // HERE!!!
        { name: "PB14", x: 91.5, y: 89, functions: ["ARD_D1 (DEFAULT)", "STLINK_TX (T_VCP_TX)"], group: "PA14"},

        { name: "PB12", x: 95, y: 59, functions: ["IO"], group: "IO"},
        // { name: "", x: 95, y: 62, functions: []},
        { name: "GND", x: 95, y: 65, functions: ["Ground"], group: "GND"},
        { name: "PB2", x: 95, y: 68, functions: ["IO"], group: "IO"},
        { name: "PB1(*)", x: 95, y: 71, functions: ["IO"], group: "IO"},
        { name: "PB15", x: 95, y: 74, functions: ["ARD_D0 (DEFAULT)", "STLINK_RX (T_VCP_RX)"], group: "PB15"},
        { name: "PB14", x: 95, y: 77, functions: ["ARD_D1 (DEFAULT)", "STLINK_TX (T_VCP_TX)"], group: "PB14"},
        { name: "PB13", x: 95, y: 80, functions: ["IO"], group: "IO"},
        { name: "AGND", x: 95, y: 83, functions: ["Analog Ground"]},
        { name: "PC4", x: 95, y: 86, functions: []}, // HERE!!! FOR FUNCTIONS
        { name: "PB8", x: 95, y: 89, functions: ["IO"], group: "IO"},
        // { name: "", x: 95, y: 92, functions: []},





    ];

    const wrapper = document.getElementById("board-wrapper");
    const tooltip = document.getElementById("tooltip");
    const searchInput = document.getElementById("search");
    const showAllBtn = document.getElementById("showAllBtn");
    const matchCount = document.getElementById("matchCount");

    // Create a marker element for each pin
    const markerEls = pins.map(pin => {
      const el = document.createElement("div");
      el.className = "pin-marker";
      el.style.left = pin.x + "%";
      el.style.top = pin.y + "%";
      el.dataset.name = pin.name.toLowerCase();
      el.dataset.functions = pin.functions.join(" ").toLowerCase();

    el.addEventListener("mouseenter", () => {
        showTooltip(pin);
        highlightGroup(pin);
    });

    el.addEventListener("mousemove", (e) => positionTooltip(e));
    el.addEventListener("mouseleave", () => {
        hideTooltip();
        clearGroupHighlight();
    });

      wrapper.appendChild(el);
      return { el, pin };
    });

    function showTooltip(pin) {
      const groupNote = pin.group
        ? `<div style="opacity:0.7; font-size:0.75rem; margin-top:0.25rem;">connected to ${pins.filter(p => p.group === pin.group).length - 1} other ${pin.group} pin(s)</div>`
        : "";
      tooltip.innerHTML = `
        <div class="pin-name">${pin.name}</div>
        <ul>${pin.functions.map(f => `<li>${f}</li>`).join("")}</ul>
        ${groupNote}
      `;
      tooltip.style.display = "block";
    }

    function positionTooltip(e) {
      const rect = wrapper.getBoundingClientRect();
      tooltip.style.left = (e.clientX - rect.left + 15) + "px";
      tooltip.style.top = (e.clientY - rect.top + 15) + "px";
    }

    function hideTooltip() {
      tooltip.style.display = "none";
    }

    function highlightGroup(hoveredPin) {
      if (!hoveredPin.group) return;
      markerEls.forEach(({ el, pin }) => {
        if (pin.group === hoveredPin.group) {
          el.classList.add("group-highlight");
        }
      });
    }
 
    function clearGroupHighlight() {
      markerEls.forEach(({ el }) => el.classList.remove("group-highlight"));
    }




    // Search: highlight matches, dim non-matches
    function runSearch() {
      const query = searchInput.value.trim().toLowerCase();
      let matches = 0;

      markerEls.forEach(({ el }) => {
        if (query === "") {
          el.classList.remove("highlight", "dimmed");
          return;
        }
        const isMatch = el.dataset.name.includes(query) || el.dataset.functions.includes(query);
        el.classList.toggle("highlight", isMatch);
        el.classList.toggle("dimmed", !isMatch);
        if (isMatch) matches++;
      });

      matchCount.textContent = query === "" ? "" : `${matches} match${matches === 1 ? "" : "es"}`;
    }

    searchInput.addEventListener("input", runSearch);

    showAllBtn.addEventListener("click", () => {
      searchInput.value = "";
      runSearch();
    });
  </script>

</body>
</html>
